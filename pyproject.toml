[project]
name = "engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "John", email = "j@ao.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
engine = "engine:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
extend-exclude = ["reference"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.ruff.format]
line-ending = "lf"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not live"]
markers = ["live: calls real SEC endpoints; run by hand with: uv run pytest -m live"]
