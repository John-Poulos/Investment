# Company names as other filers write them (M02 part 5, D-M02-7, D-M02-35). Hand-edited;
# the app never edits this file. Used to find companies in filing text:
# - L1: a customer's own 10-K names a supplier ("we rely on TSMC to manufacture ...");
# - L2: full-text search for a customer's names in suppliers' filings, with the targeted
#   phrases "<name> accounted for", "sales to <name>", "revenue from <name>",
#   "<name> represented";
# - L3: contracts (8-K Item 1.01 exhibits) naming both parties.
#
# [KEY]                     # the ticker when the company has one; any short key otherwise
# ticker = "NVDA"           # optional; links resolve to the SEC company when given
# names = ["NVIDIA Corporation", "NVIDIA"]   # longest first; matched case-sensitively in
#                                            # text, case-insensitively by full-text search
# customer = true           # search suppliers' filings for this name (L2)
# bare = true               # also search the bare name in hardware/semiconductor filers
#                           # (option (c), trial for NVIDIA, D-M02-38)
#
# usaspending = ["…"]      # exact USAspending recipient names (D-M02-61 (3)): used as the
#                           # search text and for mapping awards to the company. Names below
#                           # were found with USAspending's recipient lookup on 2026-10-12 and
#                           # need the owner's confirmation; Apple's own entry was not among the
#                           # lookup's top results (seen in the 2026-10-12 live run); no Marvell
#                           # recipient was found.
#
# Avoid names that are common words or parts of other names ("Meta" in "metadata",
# "Apple" alone is fine with word boundaries but "Oracle" also names a database).

# --- Watchlist and large spenders (L2 customers) ---------------------------------------
[NVDA]
ticker = "NVDA"
names = ["NVIDIA Corporation", "NVIDIA Corp", "NVIDIA"]
customer = true
bare = true
usaspending = ["NVIDIA CORP", "NVIDIA PUBLIC SECTOR CORPORATION"]

