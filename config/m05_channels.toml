# M05 spend channel (D-M05-1; docs/M05_FUTURE_SPEND.md). Hand-edited by the owner; the
# engine reads this file and never writes it. M04's model-tag loader ignores it.
# Allowed channels (any other value rejects the file; every company then reads "unset"):
#   fabless, outsourced   commitments lead; capex_demand and growth_capex_roic are info (R9)
#   fab_owner, hyperscaler, long_cycle, manufacturer   every gauge, capex signals carry weight
#   n/a                   every M05 row "missing: not applicable (channel n/a)"
# A company not listed reads "channel unset": every gauge shown, commitment_cover info only.
# Key by `cik` (10 digits, wins; tickers can be recycled, D-M04-74) and/or `ticker`.
# CIKs are filled only where already used elsewhere in the repo; add the others if wanted.

