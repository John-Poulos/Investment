# Followed managers (M07 Part 2; D-M07-6, D-M07-7). Owner-edited.
#
# Each [[manager]] is a 13F-HR filer whose quarterly holdings of OUR companies (core,
# promoted, tracked) become the `followed_manager_13f` signal: soft in MY, info in PT and ST,
# always lagged (filed up to 45 days after the quarter end).
#
#   name = the filer's name as EDGAR writes it (used to resolve the CIK when cik is empty)
#   cik  = the 13F filer CIK, 10 digits; leave "" to resolve it by name (a stored company of
#          that exact name, else one EDGAR company search when the owner runs
#          `uv run python scripts/run_ownership.py managers`; the log prints the CIK found —
#          write it here afterwards)
#   note = who the owner follows through this filer (display only)
#
# After adding a manager, run `uv run python scripts/run_ownership.py managers --dry-run`
# (request count, 0 requests), then without --dry-run (its last 8 quarters, once); the
# nightly refresh then reads only its new 13F-HR filings.

[[manager]]
name = "Berkshire Hathaway Inc"
cik = "0001067983"  # from the pack's 13F-HR URLs (S243)
note = "Warren Buffett"

[[manager]]
name = "Duquesne Family Office LLC"
cik = "0001536411"  # EDGAR company search, live check 2026-10-19
note = "Stanley Druckenmiller"

# "CEO of equity" (outline, Ownership item 2) is not identified yet (DESIGN Q3, D-M07-7);
# the guess "CEO of Fidelity" (Abigail P. Johnson, FMR) is unconfirmed and not added.

# Optional: a 13F issuer CUSIP (first 6 characters) the engine cannot resolve → one of our
# tickers (or a CIK). The managers log lists unresolved and "possibly ours" rows.
[cusips]
