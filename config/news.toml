# --- Grades for Finnhub / Massive items ---------------------------------------------------
[grades]
# Outlets graded B ("credible report", D14), by domain (Massive gives the article URL) and
# by Finnhub's source name (Finnhub often links through its own redirect). The trade-press
# domains above are added automatically. Anything not listed is C — edit to taste.
outlets = [
    "reuters.com", "bloomberg.com", "wsj.com", "ft.com", "cnbc.com", "apnews.com",
    "marketwatch.com", "barrons.com", "nytimes.com", "theinformation.com",
    "economist.com", "axios.com", "techcrunch.com", "theverge.com", "arstechnica.com",
]
sources = [
    "Reuters", "Bloomberg", "WSJ", "Wall Street Journal", "Financial Times", "CNBC",
    "MarketWatch", "Barron's", "AP", "Associated Press", "The Information", "TechCrunch",
]

[finnhub]
first_days = 30     # history fetched the first time a symbol is seen (free tier: 1 year)
overlap_days = 2    # each later request starts this many days before the last success

[massive]
max_per_run = 10    # backup only, when Finnhub fails for a symbol (free tier: 5/min)
