# Seed themes for M02 (D-M02-16). Hand-edited by the owner; the app never writes here.
# A theme = a named set of phrases (one EDGAR full-text query per phrase, merged by
# accession; D-M02-1). Phrases are matched case-insensitively as exact phrases; no
# operators. `companies` links watchlist tickers to the theme (optional).
# Engine-proposed themes and phrases live in the database with the owner's decisions.

