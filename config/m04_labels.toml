# M04 owner labels (D-M04-51, D-M04-73; M04_BUILD_LOG "Label schedule").
#
# Created by M04 Part 3 as a template. The OWNER fills `label`, `label_date` and `note`
# during Parts 3–7, blind (before seeing any engine output for that episode). The app
# never edits this file; Part 8b reads it (confusion matrix, label stability, walk-forward:
# calibrate on episodes up to FY2017, test on 2018 onward). Red-flag weights stay 0 until
# at least 20 owner-labelled episodes exist (D-M04-45, D-M04-60).
#
# CvD labels (one per episode): CYCLICAL_TROUGH, CYCLE_PLUS_DAMAGE, STUMBLE,
#   STRUCTURAL_DECLINE, NO_SLOWDOWN, AMBIGUOUS
# Red-flag labels (one per row): flag (the flag should have fired), clean (it should not),
#   unsure
# label_date: the day you wrote the label (YYYY-MM-DD). Leave a row blank to skip it.
# CIKs were filled at build from memory: check any that look wrong before Part 8b
# (`uv run python scripts/check_tickers.py` or EDGAR company search).
#
# Windows are fiscal years (FY) or calendar years as the episode list in M04_BUILD_LOG
# names them. `set`: calibrate (up to FY2017) or test (2018 onward); controls are
# no-slowdown cases. Episodes carry no expected group (trough, damage, stumble, decline):
# it would spoil blind labelling (owner, 2026-10-12). The groups are listed only in
# docs/M04_BUILD_LOG.md "Label schedule"; Part 8b groups by that list.

